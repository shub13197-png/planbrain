[project]
name = "planbrain"
version = "0.0.0"
description = "Supply chain planning layer on top of an existing system of record"
requires-python = ">=3.11"
dependencies = [
    # Validates every payload crossing the queue boundary. Without a validator
    # the schema is decorative, and a malformed payload surfaces as a failed
    # worker job minutes later instead of at the call site. MIT.
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = [
    "pytest",
    # TEST-ONLY oracle for Wagner-Whitin. stockpyl is the locked stack's
    # inventory library and its published instances are our textbook fixtures,
    # but it declares sphinx==4.5.0 among its install requirements -- a pinned
    # documentation toolchain, which has no business inside an InvenTree plugin's
    # runtime tree. planbrain.netreq implements the DP itself and is cross-checked
    # against stockpyl here. MIT.
    "stockpyl>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
