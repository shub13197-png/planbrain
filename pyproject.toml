[project]
name = "planbrain"
version = "0.0.0"
description = "Supply chain planning layer on top of an existing system of record"
requires-python = ">=3.11"
dependencies = [
    # Validates every payload crossing the queue boundary. Without a validator
    # the schema is decorative, and a malformed payload surfaces as a failed
    # worker job minutes later instead of at the call site. MIT.
    "jsonschema>=4.20",
    # Statistical forecasting: AutoETS for frequent demand, Croston/TSB for
    # intermittent. Apache-2.0, and its dependency list is ordinary scientific
    # Python -- no pinned toolchain, unlike stockpyl. Judged on its own shape per
    # the standing policy in docs/decisions.md. An AutoARIMA is not something to
    # reimplement in twenty lines; a Wagner-Whitin DP is.
    "statsforecast>=2.0",
    # Reads the .xlsx files customers actually send. MIT. No network: it is a
    # zip-and-XML reader, and the offline audit found nothing reachable in it.
    "openpyxl>=3.1",
    # Column-mapping profiles are YAML because a user must be able to hand-write
    # one in a text editor -- a SAP or Tally profile is just a file we ship.
    # MIT, no dependencies of its own. Loaded exclusively with safe_load:
    # yaml.load executes arbitrary Python and a profile is the kind of file that
    # gets emailed around.
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    # TEST-ONLY oracle for Wagner-Whitin. stockpyl is the locked stack's
    # inventory library and its published instances are our textbook fixtures,
    # but it declares sphinx==4.5.0 among its install requirements -- a pinned
    # documentation toolchain, which has no business inside an InvenTree plugin's
    # runtime tree. planbrain.netreq implements the DP itself and is cross-checked
    # against stockpyl here. MIT.
    "stockpyl>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Explicit, because auto-discovery cannot work here and fails hard rather than
# guessing. A flat layout with four top-level directories -- `planbrain`,
# `packaging`, `desktop`, `datasets` -- is ambiguous, so setuptools refuses to
# build at all: "Multiple top-level packages discovered in a flat-layout".
#
# This went unnoticed because the local environment had an editable install from
# back when the tree had one top-level directory, and an install already in place
# is never re-resolved. `pip install -e ".[dev]"` -- the first line of the README,
# of docs/install.md and of every CI job -- could not have worked on a clean
# clone. Found by the first push to a real runner, which is the environment that
# matters and the one nothing here had ever run in.
#
# Only `planbrain` ships. `tools` stays a repo-root module reached through the
# pythonpath setting below, `packaging` holds build scripts, and `desktop` is
# Rust and HTML.
[tool.setuptools.packages.find]
include = ["planbrain*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repo root, so `tools` imports the same way inside the container as it does
# from a checkout. Without this the suite collects locally and fails in the
# image -- which is exactly what the offline CI job found, because nothing had
# ever run the tests in the packaged environment before.
pythonpath = ["."]
