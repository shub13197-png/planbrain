[package]
name = "planbrain-desktop"
version = "0.1.0"
edition = "2021"
description = "Supply chain planning that runs entirely offline"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# The file picker, and nothing else. tauri-plugin-shell was dropped: the
# backend is spawned with std::process at a path we computed, so a shell scope
# would be a permission to grant and a dependency to audit for no benefit.
tauri-plugin-dialog = "2"

[profile.release]
strip = true
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"
